<script>
(() => {
  const safeInit = () => {
    // Keep search and Band/Mode filters visible while toggling only the logbook rows.
    document.querySelectorAll('h3').forEach((heading) => {
      if (!/QSO Log/i.test(heading.textContent || '') || heading.dataset.toggleReady) return;
      heading.dataset.toggleReady = '1';
      const toolbar = heading.parentElement;
      const card = heading.closest('.rounded-xl') || heading.parentElement.parentElement;
      const tableWrap = card.querySelector('.overflow-x-auto');
      if (!tableWrap) return;
      const pager = Array.from(card.children).find(el =>
        el !== toolbar && !el.contains(toolbar) &&
        /Page\s+\d+\s+of/i.test(el.textContent || '')
      );
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'logbook-toggle';
      button.textContent = 'Logboek verbergen';
      button.setAttribute('aria-pressed', 'true');
      button.addEventListener('click', () => {
        const currentlyVisible = tableWrap.style.display !== 'none';
        tableWrap.style.display = currentlyVisible ? 'none' : '';
        if (pager) pager.style.display = currentlyVisible ? 'none' : '';
        button.textContent = currentlyVisible ? 'Logboek tonen' : 'Logboek verbergen';
        button.setAttribute('aria-pressed', String(!currentlyVisible));
      });
      toolbar.appendChild(button);
    });

    // The original bundle included Leaflet's JavaScript but omitted its stylesheet.
    // Trigger a resize after layout changes so Leaflet recalculates its tile grid.
    const map = document.querySelector('.leaflet-container');
    if (map) {
      map.style.height = '560px';
